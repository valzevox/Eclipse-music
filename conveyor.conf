include required("/stdlib/electron/electron.conf")

package-json {
  include required("package.json")
  include required("package-lock.json")
}

app {
  display-name = "Eclipse"
  rdns-name = "io.github.eclipse.app"
  vcs-url = "https://github.com/valzevox/Eclipse-music"
  vendor = "valzevox"
  description = "A free, open-source music player and audio workstation suite."
  license = "MIT"
  icons = "assets/icon.png"

  // Open source tier: updates shipped manually via GitHub Releases
  updates = none

  // Include application source files explicitly into inputs
  inputs += src -> src
  inputs += assets -> assets

  machines = [
    "windows.amd64",
    "linux.amd64.glibc",
    "mac.amd64", "mac.aarch64"
  ]

  mac.info-plist.LSMinimumSystemVersion = 12.0.0
}

conveyor.compatibility-level = 22

// Loosen disk cache requirement like SimpMusic
conveyor.disk-cache.minimum-free-disk-space = 1 GB