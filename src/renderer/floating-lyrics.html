<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eclipse Mini Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }
    .floating-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(14, 14, 18, 0.84);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      color: #ffffff;
      cursor: grab;
      -webkit-app-region: drag;
      position: relative;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .floating-container:hover {
      background: rgba(18, 18, 24, 0.94);
      border-color: rgba(255, 255, 255, 0.24);
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.7);
    }
    .floating-container:active {
      cursor: grabbing;
    }

    /* Top Controls Row */
    .floating-controls {
      position: absolute;
      top: 6px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.2s cubic-bezier(0.23, 1, 0.32, 1);
      -webkit-app-region: no-drag;
      z-index: 10;
    }
    .floating-container:hover .floating-controls {
      opacity: 1;
    }
    .ctrl-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.12s, color 0.15s;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.08);
    }
    .ctrl-btn:active {
      transform: scale(0.92);
    }
    .ctrl-btn.active-fav {
      color: #ec4899;
      background: rgba(236, 72, 153, 0.2);
    }

    /* Main Content Row (Landscape default) */
    .mini-main-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      margin-top: 2px;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    .mini-cover {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
      display: block;
      transition: width 0.25s cubic-bezier(0.2, 0, 0, 1), height 0.25s cubic-bezier(0.2, 0, 0, 1), border-radius 0.25s ease, box-shadow 0.25s ease;
    }

    .mini-lyrics-block {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .mini-track-meta {
      display: none;
      margin-bottom: 4px;
    }
    .mini-track-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }
    .mini-track-artist {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }

    /* Current active line container */
    .lyrics-active-line {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: baseline;
      gap: 5px;
      min-height: 22px;
    }

    /* Word span styling */
    .lyric-w {
      position: relative;
      display: inline-block;
      color: rgba(255, 255, 255, 0.55);
      transition: color 0.15s ease, transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .lyric-w.active-word {
      color: #ffffff;
      transform: scale(1.03);
      text-shadow: 0 0 14px rgba(107, 185, 255, 0.8), 0 2px 8px rgba(0,0,0,0.8);
    }

    .lyric-w.past-word {
      color: #ffffff;
    }

    /* Smooth continuous line gradient fallback */
    .lyrics-active-line.gradient-fill {
      background: linear-gradient(90deg, #ffffff var(--prog, 0%), rgba(255, 255, 255, 0.45) calc(var(--prog, 0%) + 15%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: --prog 0.08s linear;
    }

    /* Next line preview */
    .lyrics-next-line {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.25s ease;
    }

    /* Bottom Interactive Seek Bar Row */
    .mini-seek-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      -webkit-app-region: no-drag;
      opacity: 0.65;
      transition: opacity 0.2s ease;
    }
    .floating-container:hover .mini-seek-row {
      opacity: 1;
    }
    .mini-time-label {
      font-size: 10px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.6);
      min-width: 26px;
    }
    .mini-scrubber-track {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .mini-scrubber-track.dragging {
      cursor: grabbing;
    }
    .mini-squiggly-canvas {
      width: 100%;
      height: 24px;
      display: block;
      pointer-events: none;
    }

    /* =========================================================
       SQUARE / TALL LAYOUT (aspect-ratio <= 1.3 && height >= 180px)
       ========================================================= */
    .floating-container.square-mode {
      padding: 14px 16px;
      justify-content: flex-start;
      gap: 10px;
    }
    .floating-container.square-mode .floating-controls {
      opacity: 1;
      top: 10px;
      right: 12px;
    }
    .floating-container.square-mode .mini-main-row {
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 18px;
      gap: 12px;
      flex: 1;
    }
    .floating-container.square-mode .mini-cover {
      width: clamp(100px, 46vmin, 180px);
      height: clamp(100px, 46vmin, 180px);
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 20px rgba(167, 139, 250, 0.2);
    }
    .floating-container.square-mode .mini-track-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .floating-container.square-mode .mini-track-title {
      font-size: 15px;
      max-width: 90%;
    }
    .floating-container.square-mode .mini-track-artist {
      font-size: 12px;
      max-width: 85%;
    }
    .floating-container.square-mode .mini-lyrics-block {
      align-items: center;
      text-align: center;
      width: 100%;
    }
    .floating-container.square-mode .lyrics-active-line {
      font-size: 15px;
      justify-content: center;
      text-align: center;
      width: 100%;
    }
    .floating-container.square-mode .lyrics-next-line {
      font-size: 12px;
      text-align: center;
      width: 100%;
    }
    .floating-container.square-mode .mini-seek-row {
      width: 100%;
      margin-top: 8px;
      opacity: 0.85;
    }

    /* Responsive Breakpoints */
    @media (max-width: 280px) {
      .floating-container:not(.square-mode) .mini-cover { display: none; }
      .floating-container:not(.square-mode) .lyrics-next-line { display: none; }
      .floating-container:not(.square-mode) .lyrics-active-line { font-size: 14px; }
      .floating-container:not(.square-mode) .mini-time-label { display: none; }
    }
    @media (min-width: 480px) {
      .floating-container:not(.square-mode) .mini-cover { width: 52px; height: 52px; border-radius: 12px; }
      .floating-container:not(.square-mode) .lyrics-active-line { font-size: 18px; }
      .floating-container:not(.square-mode) .lyrics-next-line { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="floating-container" id="floating-box">
    <div class="floating-controls">
      <button class="ctrl-btn" id="btn-fav" title="Favorite">♥</button>
      <button class="ctrl-btn" id="btn-mute" title="Mute">♪</button>
      <button class="ctrl-btn" id="btn-prev" title="Previous (Left Arrow)">◀</button>
      <button class="ctrl-btn" id="btn-playpause" title="Play/Pause (Space)">▶</button>
      <button class="ctrl-btn" id="btn-next" title="Next (Right Arrow)">▶</button>
      <button class="ctrl-btn" id="btn-close" title="Close" style="margin-left: 2px;">✕</button>
    </div>

    <div class="mini-main-row">
      <img class="mini-cover" id="mini-cover" src="" alt="Album cover" style="display: none;">
      <div class="mini-track-meta" id="mini-track-meta">
        <div class="mini-track-title" id="mini-track-title">Eclipse</div>
        <div class="mini-track-artist" id="mini-track-artist">Studio</div>
      </div>
      <div class="mini-lyrics-block">
        <div class="lyrics-active-line" id="lyric-current">Eclipse Music</div>
        <div class="lyrics-next-line" id="lyric-next">Play a track with synced lyrics</div>
      </div>
    </div>

    <div class="mini-seek-row">
      <span class="mini-time-label" id="mini-time-cur">0:00</span>
      <div class="mini-scrubber-track" id="mini-scrubber-track">
        <canvas class="mini-squiggly-canvas" id="mini-squiggly-canvas"></canvas>
      </div>
      <span class="mini-time-label" id="mini-time-dur" style="text-align: right;">0:00</span>
    </div>
  </div>

  <script>
    const boxEl = document.getElementById('floating-box');
    const curEl = document.getElementById('lyric-current');
    const nextEl = document.getElementById('lyric-next');
    const coverEl = document.getElementById('mini-cover');
    const metaTitleEl = document.getElementById('mini-track-title');
    const metaArtistEl = document.getElementById('mini-track-artist');
    const btnPlayPause = document.getElementById('btn-playpause');
    const btnFav = document.getElementById('btn-fav');
    const btnMute = document.getElementById('btn-mute');
    const seekTrack = document.getElementById('mini-scrubber-track');
    const seekCanvas = document.getElementById('mini-squiggly-canvas');
    const seekCtx = seekCanvas ? seekCanvas.getContext('2d') : null;
    const timeCurEl = document.getElementById('mini-time-cur');
    const timeDurEl = document.getElementById('mini-time-dur');

    let currentLineText = '';
    let currentWords = null;
    let smoothProgress = 0;
    let targetProgress = 0;
    let animFrame = null;
    let isDraggingSeek = false;
    let cachedDuration = 0;
    let cachedCurrentTime = 0;
    let dragTargetFrac = 0;
    let isPlayingState = false;
    let isAutomixingState = false;
    let perfModeState = false;
    let cachedPrimaryColor = '#a78bfa';
    let scrubProgress = 0;
    let scrubPhase = 0;
    let scrubKnobAnim = 0;
    let scrubPrevKnobX = null;
    let scrubLastTime = 0;
    let rainbowBlend = 0;
    let rainbowLastMs = 0;
    const reducedMotionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    let osReducedMotion = !!(reducedMotionQuery && reducedMotionQuery.matches);
    if (reducedMotionQuery && reducedMotionQuery.addEventListener) {
      reducedMotionQuery.addEventListener('change', (e) => {
        osReducedMotion = !!e.matches;
        if (osReducedMotion) rainbowBlend = 0;
        drawMiniSeekbar(performance.now());
      });
    }
    function isReducedActive() {
      return perfModeState || osReducedMotion;
    }

    // Detect Square vs Landscape layout based on aspect ratio
    function evaluateLayoutMode() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspectRatio = w / Math.max(1, h);
      const isSquareOrTall = aspectRatio <= 1.35 && h >= 170;
      boxEl.classList.toggle('square-mode', isSquareOrTall);
    }

    window.addEventListener('resize', evaluateLayoutMode);
    evaluateLayoutMode();

    function formatTime(sec) {
      if (!sec || isNaN(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function syncMiniCanvasSize() {
      if (!seekTrack || !seekCanvas || !seekCtx) return 0;
      const dpr = window.devicePixelRatio || 1;
      const w = seekTrack.clientWidth || 160;
      const h = 24;
      const ew = Math.round(w * dpr);
      const eh = Math.round(h * dpr);
      if (w > 0 && (seekCanvas.width !== ew || seekCanvas.height !== eh)) {
        seekCanvas.width = ew;
        seekCanvas.height = eh;
        seekCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      return w;
    }
    if (seekTrack && typeof ResizeObserver === 'function') {
      new ResizeObserver(() => {
        syncMiniCanvasSize();
        drawMiniSeekbar(performance.now());
      }).observe(seekTrack);
    }

    function drawMiniSeekbar(nowMs) {
      if (!seekCtx || !seekCanvas) return;
      const w = syncMiniCanvasSize();
      if (w <= 0) return;
      const h = 24;
      const dt = scrubLastTime === 0 ? 0.016 : Math.min((nowMs - scrubLastTime) / 1000, 0.1);
      scrubLastTime = nowMs;

      const isReduced = isReducedActive();
      const targetBlend = (isAutomixingState && !isReduced) ? 1 : 0;
      if (isReduced) {
        rainbowBlend = 0;
        rainbowLastMs = nowMs;
      } else {
        const rDt = rainbowLastMs === 0 ? 16 : Math.min(nowMs - rainbowLastMs, 100);
        rainbowLastMs = nowMs;
        if (rainbowBlend !== targetBlend) {
          const step = rDt / 300;
          rainbowBlend = targetBlend > rainbowBlend
            ? Math.min(1, rainbowBlend + step)
            : Math.max(0, rainbowBlend - step);
        }
      }

      const targetFrac = isDraggingSeek
        ? dragTargetFrac
        : (cachedDuration > 0 ? Math.max(0, Math.min(1, cachedCurrentTime / cachedDuration)) : 0);
      const followSpeed = isDraggingSeek ? 32 : 45;
      scrubProgress += (targetFrac - scrubProgress) * Math.min(1, dt * followSpeed);
      scrubProgress = Math.max(0, Math.min(1, Number.isFinite(scrubProgress) ? scrubProgress : 0));

      const targetAnim = isDraggingSeek ? 1 : 0;
      scrubKnobAnim += (targetAnim - scrubKnobAnim) * Math.min(1, dt * 16);
      const curKnobW = 5 + 1.5 * scrubKnobAnim;
      const curKnobH = 16 + 4 * scrubKnobAnim;
      const curKnobR = curKnobW / 2;

      const padLeft = 4;
      const padRight = 4;
      const trackWidth = Math.max(1, w - padLeft - padRight);
      const knobCenterX = Math.max(padLeft, Math.min(w - padRight, padLeft + scrubProgress * trackWidth));

      if (scrubPrevKnobX === null) scrubPrevKnobX = knobCenterX;
      const deltaX = knobCenterX - scrubPrevKnobX;
      scrubPrevKnobX = knobCenterX;

      const k = (2 * Math.PI) / 28;
      if (!isReduced) {
        if (isDraggingSeek) {
          scrubPhase += deltaX * k;
        } else if (isPlayingState) {
          scrubPhase += 3.5 * dt;
        }
      }

      const capRadius = 5.5 / 2;
      const knobLeft = knobCenterX - curKnobW / 2;
      const waveStart = padLeft;
      const waveEnd = knobLeft - 3.5 - capRadius;
      const bgStartX = knobCenterX + (curKnobW / 2) + 3.5;
      const bgEndX = w - padRight;
      const centerY = h / 2;

      seekCtx.clearRect(0, 0, w, h);

      if (bgStartX < bgEndX - 1) {
        seekCtx.save();
        seekCtx.beginPath();
        seekCtx.lineWidth = 5.5;
        seekCtx.lineCap = 'round';
        seekCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        seekCtx.moveTo(bgStartX, centerY);
        seekCtx.lineTo(bgEndX, centerY);
        seekCtx.stroke();
        seekCtx.restore();
      }

      if (waveEnd > waveStart) {
        seekCtx.beginPath();
        seekCtx.lineWidth = 5.5;
        seekCtx.lineCap = 'round';
        seekCtx.lineJoin = 'round';
        if (isReduced) {
          seekCtx.moveTo(waveStart, centerY);
          seekCtx.lineTo(waveEnd, centerY);
        } else {
          for (let x = waveStart; x <= waveEnd; x += 2) {
            const angle = scrubPhase - (waveEnd - x) * k;
            const y = centerY + Math.sin(angle) * 3;
            if (x === waveStart) seekCtx.moveTo(x, y);
            else seekCtx.lineTo(x, y);
          }
          seekCtx.lineTo(waveEnd, centerY + Math.sin(scrubPhase) * 3);
        }
        if (rainbowBlend > 0.01 && !isReduced) {
          if (rainbowBlend < 0.99) {
            seekCtx.strokeStyle = cachedPrimaryColor;
            seekCtx.stroke();
          }
          const hue = ((nowMs % 1000) / 1000) * 360;
          seekCtx.save();
          seekCtx.globalAlpha = rainbowBlend;
          seekCtx.strokeStyle = `hsl(${hue.toFixed(1)}, 100%, 62%)`;
          seekCtx.stroke();
          seekCtx.restore();
        } else {
          seekCtx.strokeStyle = cachedPrimaryColor;
          seekCtx.stroke();
        }
      }

      seekCtx.beginPath();
      seekCtx.roundRect(knobLeft, centerY - curKnobH / 2, curKnobW, curKnobH, curKnobR);
      seekCtx.fillStyle = cachedPrimaryColor;
      seekCtx.fill();
    }

    function animateSmoothProgress(nowMs) {
      if (curEl.classList.contains('gradient-fill')) {
        const diff = targetProgress - smoothProgress;
        smoothProgress += diff * 0.18;
        curEl.style.setProperty('--prog', `${smoothProgress.toFixed(1)}%`);
      }
      drawMiniSeekbar(nowMs || performance.now());
      animFrame = requestAnimationFrame(animateSmoothProgress);
    }
    animFrame = requestAnimationFrame(animateSmoothProgress);

    function renderWords(words, currentTime) {
      const existingSpans = curEl.querySelectorAll('.lyric-w');
      if (existingSpans.length !== words.length) {
        curEl.innerHTML = '';
        curEl.classList.remove('gradient-fill');
        words.forEach((w) => {
          const span = document.createElement('span');
          span.className = 'lyric-w';
          span.textContent = (w.word || w.text || '') + ' ';
          curEl.appendChild(span);
        });
      }

      const spans = curEl.querySelectorAll('.lyric-w');
      words.forEach((w, idx) => {
        const span = spans[idx];
        if (!span) return;
        const wStart = w.start !== undefined ? w.start : (w.time || 0);
        const wEnd = w.end !== undefined ? w.end : (w.endTime || (words[idx + 1] ? words[idx + 1].start : wStart + 0.4));

        if (currentTime >= wEnd) {
          span.className = 'lyric-w past-word';
        } else if (currentTime >= wStart) {
          span.className = 'lyric-w active-word';
        } else {
          span.className = 'lyric-w';
        }
      });
    }

    // In-Window Keyboard Shortcuts (Space: Play/Pause, ArrowLeft: Prev, ArrowRight: Next)
    window.addEventListener('keydown', (e) => {
      // Guard against holding key repeat
      if (e.repeat) return;

      if (e.code === 'Space') {
        e.preventDefault();
        if (window.electronAPI && window.electronAPI.floatingCommand) {
          window.electronAPI.floatingCommand('toggle');
        }
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        if (window.electronAPI && window.electronAPI.floatingCommand) {
          window.electronAPI.floatingCommand('prev');
        }
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        if (window.electronAPI && window.electronAPI.floatingCommand) {
          window.electronAPI.floatingCommand('next');
        }
      }
    });

    if (window.electronAPI) {
      if (window.electronAPI.onFloatingLyricsUpdate) {
        window.electronAPI.onFloatingLyricsUpdate((data) => {
          if (!data) return;

          // Next line
          if (data.next !== undefined && nextEl.textContent !== data.next) {
            nextEl.style.opacity = '0';
            setTimeout(() => {
              nextEl.textContent = data.next || '';
              nextEl.style.opacity = '1';
            }, 100);
          }

          // Metadata Title & Artist for Square Mode
          if (data.title && metaTitleEl && metaTitleEl.textContent !== data.title) {
            metaTitleEl.textContent = data.title;
          }
          if (data.artist && metaArtistEl && metaArtistEl.textContent !== data.artist) {
            metaArtistEl.textContent = data.artist;
          }

          // Playback & theme state
          if (data.isPlaying !== undefined) {
            isPlayingState = !!data.isPlaying;
            if (btnPlayPause) btnPlayPause.textContent = isPlayingState ? '❚❚' : '▶';
          }
          if (data.primaryColor) cachedPrimaryColor = data.primaryColor;
          if (data.isAutomixing !== undefined) isAutomixingState = !!data.isAutomixing;
          if (data.perfMode !== undefined) perfModeState = !!data.perfMode;

          // Favorite state
          if (data.isLiked !== undefined && btnFav) {
            btnFav.classList.toggle('active-fav', !!data.isLiked);
          }

          // Mute state
          if (data.isMuted !== undefined && btnMute) {
            btnMute.textContent = data.isMuted ? '✕' : '♪';
            btnMute.style.opacity = data.isMuted ? '0.5' : '1';
          }

          // Cover Art
          if (data.thumbnail && coverEl) {
            if (coverEl.src !== data.thumbnail) coverEl.src = data.thumbnail;
            coverEl.style.display = 'block';
          }

          // Seek progress & duration
          if (typeof data.duration === 'number' && data.duration > 0) {
            cachedDuration = data.duration;
            if (timeDurEl) timeDurEl.textContent = formatTime(data.duration);
          }
          if (typeof data.currentTime === 'number' && !isDraggingSeek) {
            cachedCurrentTime = data.currentTime;
            if (timeCurEl) timeCurEl.textContent = formatTime(data.currentTime);
          }

          const lineChanged = (currentLineText !== data.current);
          if (lineChanged) {
            currentLineText = data.current || '';
            smoothProgress = 0;
            targetProgress = 0;
          }

          // Word-by-word timestamps
          if (data.words && Array.isArray(data.words) && data.words.length > 0) {
            currentWords = data.words;
            renderWords(data.words, data.currentTime || 0);
          } else {
            if (lineChanged || curEl.querySelector('.lyric-w')) {
              curEl.innerHTML = '';
              curEl.textContent = currentLineText || 'Eclipse';
              curEl.classList.add('gradient-fill');
            }
            targetProgress = Math.min(100, Math.max(0, data.progress != null ? data.progress : 0));
          }
        });
      }

      if (window.electronAPI.floatingLyricsReady) {
        window.electronAPI.floatingLyricsReady();
      }

      document.getElementById('btn-prev').addEventListener('click', () => {
        window.electronAPI.floatingCommand('prev');
      });
      document.getElementById('btn-playpause').addEventListener('click', () => {
        window.electronAPI.floatingCommand('toggle');
      });
      document.getElementById('btn-next').addEventListener('click', () => {
        window.electronAPI.floatingCommand('next');
      });
      document.getElementById('btn-fav').addEventListener('click', () => {
        window.electronAPI.floatingCommand('favorite');
      });
      document.getElementById('btn-mute').addEventListener('click', () => {
        window.electronAPI.floatingCommand('mute');
      });
      document.getElementById('btn-close').addEventListener('click', () => {
        window.electronAPI.closeFloatingLyrics();
      });

      // Pointer-capture wavy scrubber seek
      function updateMiniSeekFromEvent(e) {
        if (!seekTrack) return 0;
        const rect = seekTrack.getBoundingClientRect();
        const pad = 4;
        const trackW = Math.max(1, rect.width - 2 * pad);
        const frac = Math.max(0, Math.min(1, (e.clientX - rect.left - pad) / trackW));
        dragTargetFrac = frac;
        if (cachedDuration > 0 && timeCurEl) {
          timeCurEl.textContent = formatTime(frac * cachedDuration);
        }
        return frac;
      }
      if (seekTrack) {
        seekTrack.addEventListener('pointerdown', (e) => {
          isDraggingSeek = true;
          seekTrack.classList.add('dragging');
          updateMiniSeekFromEvent(e);
          try { seekTrack.setPointerCapture(e.pointerId); } catch (_) {}
        });
        seekTrack.addEventListener('pointermove', (e) => {
          if (!isDraggingSeek) return;
          updateMiniSeekFromEvent(e);
        });
        const finishMiniSeek = (e) => {
          if (!isDraggingSeek) return;
          isDraggingSeek = false;
          seekTrack.classList.remove('dragging');
          const frac = updateMiniSeekFromEvent(e);
          if (cachedDuration > 0) cachedCurrentTime = frac * cachedDuration;
          window.electronAPI.floatingCommand({ type: 'seek-percent', percent: frac });
          try { seekTrack.releasePointerCapture(e.pointerId); } catch (_) {}
        };
        seekTrack.addEventListener('pointerup', finishMiniSeek);
        seekTrack.addEventListener('pointercancel', finishMiniSeek);
      }
    }
  </script>
</body>
</html>
