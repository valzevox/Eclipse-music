<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eclipse Floating Lyrics</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .floating-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 18px;
      background: rgba(18, 18, 22, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      color: #ffffff;
      cursor: grab;
      -webkit-app-region: drag;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }
    .floating-container:hover {
      background: rgba(22, 22, 28, 0.88);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .floating-controls {
      position: absolute;
      top: 6px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
      -webkit-app-region: no-drag;
    }
    .floating-container:hover .floating-controls {
      opacity: 1;
    }
    .ctrl-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.08);
    }
    .ctrl-btn:active {
      transform: scale(0.95);
    }
    .lyrics-active-line {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s ease;
    }
    .lyrics-active-line.has-words {
      background: linear-gradient(90deg, #93c5fd var(--progress, 0%), rgba(255,255,255,0.7) var(--progress, 0%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .lyrics-next-line {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.3;
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="floating-container" id="floating-box">
    <div class="floating-controls">
      <button class="ctrl-btn" id="btn-prev" title="Previous">⏮</button>
      <button class="ctrl-btn" id="btn-playpause" title="Play/Pause">⏯</button>
      <button class="ctrl-btn" id="btn-next" title="Next">⏭</button>
      <button class="ctrl-btn" id="btn-close" title="Close Overlay" style="margin-left: 4px;">✕</button>
    </div>
    <div class="lyrics-active-line" id="lyric-current">Eclipse Music Player</div>
    <div class="lyrics-next-line" id="lyric-next">Play a track with synced lyrics</div>
  </div>

  <script>
    const curEl = document.getElementById('lyric-current');
    const nextEl = document.getElementById('lyric-next');
    const btnPlayPause = document.getElementById('btn-playpause');

    if (window.electronAPI) {
      if (window.electronAPI.onFloatingLyricsUpdate) {
        window.electronAPI.onFloatingLyricsUpdate((data) => {
          if (!data) return;
          if (data.current) curEl.textContent = data.current;
          if (data.next !== undefined) nextEl.textContent = data.next || '';
          if (data.isPlaying !== undefined && btnPlayPause) {
            btnPlayPause.textContent = data.isPlaying ? '⏸' : '▶';
          }
          if (data.progress != null && data.progress >= 0) {
            curEl.classList.add('has-words');
            curEl.style.setProperty('--progress', `${Math.min(100, Math.max(0, data.progress))}%`);
          } else {
            curEl.classList.remove('has-words');
          }
        });
      }
      if (window.electronAPI.floatingLyricsReady) {
        window.electronAPI.floatingLyricsReady();
      }

      document.getElementById('btn-prev').addEventListener('click', () => {
        window.electronAPI.floatingCommand('prev');
      });
      document.getElementById('btn-playpause').addEventListener('click', () => {
        window.electronAPI.floatingCommand('playpause');
      });
      document.getElementById('btn-next').addEventListener('click', () => {
        window.electronAPI.floatingCommand('next');
      });
      document.getElementById('btn-close').addEventListener('click', () => {
        window.electronAPI.closeFloatingLyrics();
      });
    }
  </script>
</body>
</html>
